# Version profile: dev (latest known-good)
#
# Usage:  BUILD_VERSION=dev ./build.sh build BOARD=orangepi5b ...
#
# To create a new release, copy this file:
#   cp dev.conf v1.0.conf
# Then lock every field to the exact versions you tested.

# --- Kernel ---
# Empty = follow KERNEL_MAJOR_MINOR from the framework (floating patch version).
# Set to a tag like "v6.18.19" to pin the exact patch release.
PIN_KERNEL_TAG=""

# --- svpcom rtl8812au (out-of-tree WiFi driver for wfb-ng) ---
PIN_RTL8812AU_REPO="https://github.com/svpcom/rtl8812au.git"
PIN_RTL8812AU_COMMIT="be10cbbbd9b6b5325554a06a0132985a6b890175"
PIN_RTL8812AU_BRANCH="v5.2.20"

# --- wfb-ng (WiFi Broadcast) ---
# Empty = latest from apt.  Set to e.g. "25.01.2-1" to pin.
PIN_WFB_NG_VERSION=""

# --- gpio-service pip dependencies ---
PIN_GPIOD_VERSION="2.4.1"
PIN_PYYAML_VERSION="6.0.2"
