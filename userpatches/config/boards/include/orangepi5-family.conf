# Shared userpatch for all Orange Pi 5 family boards (orangepi5, orangepi5-plus,
# orangepi5b, orangepi5-max, orangepi5-ultra, orangepi5pro).
# Sourced after each board's main config under config/boards/.
#
# Optional extra apt packages for the target image (space-separated).
PACKAGE_LIST_BOARD="arping python3-venv vim iw rfkill build-essential dkms"

# Desktop images only: optional extras installed after the desktop environment.
# PACKAGE_LIST_DESKTOP_BOARD=""

# Install kernel headers so the svpcom rtl8812au out-of-tree driver can be built via DKMS.
INSTALL_HEADERS="yes"

# Pin kernel to an exact tag if the version profile requests it.
# PIN_KERNEL_TAG is passed via Docker env from build.sh.
if [[ -n "${PIN_KERNEL_TAG:-}" ]]; then
	declare -g KERNELBRANCH="tag:${PIN_KERNEL_TAG}"
fi

# Skip the first-login wizard, preset root password, and set bash as default shell.
# Pass ARMBIAN_PRESET_ROOT_PASSWORD=... as an env var to set a custom root password.
function post_family_tweaks__opi5_family_preset_login() {
	display_alert "$BOARD" "Preset root login / skip first-login wizard" "info"

	local root_pwd="${ARMBIAN_PRESET_ROOT_PASSWORD:-}"
	if [[ -n "${root_pwd}" ]]; then
		display_alert "Overriding root password" "(from build environment)" "info"
		printf 'root:%s\n' "${root_pwd}" | chroot "${SDCARD}" chpasswd
	fi

	rm -f "${SDCARD}/root/.not_logged_in_yet"
	chroot "${SDCARD}" /bin/bash -c "chsh -s /bin/bash root"
	rm -rf "${SDCARD}/etc/systemd/system/serial-getty@.service.d"
	rm -rf "${SDCARD}/etc/systemd/system/getty@.service.d"

	return 0
}
