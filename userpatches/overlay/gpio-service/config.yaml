api:
  port: 9010

boot:
  power_cycle_dji: true   # run once when gpio.service starts
  delay_sec: 0            # optional wait (seconds) before running

servo:
  pwm_device: "febf0010"    # device address (ls /sys/class/pwm/pwmchip*/device)
  pwm_channel: 0
  frequency_hz: 50
  pressed_us: 2000.0
  released_us: 1900.0
